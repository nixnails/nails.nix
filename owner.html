<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIX Nails | Owner Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--p:#f08fbd;--g:#d9b66f;--b:#080709}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#fff;font-family:Montserrat,Arial}.wrap{max-width:1100px;margin:auto;padding:30px 5% 70px}.brand{text-align:center;color:var(--g);font:600 42px 'Cormorant Garamond';letter-spacing:7px}.tag{text-align:center;color:var(--p);font-size:10px;letter-spacing:4px;margin-bottom:30px}h1,h2{font-family:'Cormorant Garamond';font-weight:600}h1{text-align:center;font-size:48px;margin:10px}h2{font-size:28px;color:var(--g)}.panel{border:1px solid #d9b66f55;background:linear-gradient(145deg,#1b1018,#0d0a0d);padding:25px;margin:18px 0}.hidden{display:none}label{display:block;color:#ddd;font-size:11px;letter-spacing:1px;margin:14px 0 7px}input,button,select{width:100%;padding:13px;background:#09080a;border:1px solid #d9b66f55;color:#fff;border-radius:2px;font:13px Montserrat}.btn{cursor:pointer;border-color:var(--g);color:var(--g);letter-spacing:1.5px;margin-top:15px}.btn:hover{background:var(--g);color:#080709}.status{color:var(--p);font-size:12px;line-height:1.6;margin-top:12px}.booking{border-top:1px solid #d9b66f44;padding:20px 0}.meta{color:#aaa;font-size:12px;line-height:1.8}.pill{display:inline-block;border:1px solid #d9b66f66;padding:5px 9px;font-size:10px;letter-spacing:1px;margin:4px 5px 4px 0}.photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.photos a{color:var(--p);font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;border:1px solid #d9b66f44;text-align:center}.num{font:600 34px 'Cormorant Garamond';color:var(--g)}.statusRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.smallBtn{margin-top:0}@media(max-width:700px){.grid{grid-template-columns:1fr}.statusRow{grid-template-columns:1fr}.wrap{padding-left:4%;padding-right:4%}}</style></head><body><div class="wrap"><div class="brand">NIX</div><div class="tag">OWNER DASHBOARD · LUXURY PRESS-ON NAILS</div><h1>Customer Bookings</h1><div id="login" class="panel"><h2>Owner Login</h2><label>EMAIL</label><input id="email" type="email" placeholder="Your NIX Nails owner email"><label>PASSWORD</label><input id="password" type="password" placeholder="Password"><button class="btn" id="loginBtn">LOG IN</button><div id="loginStatus" class="status"></div></div><div id="dash" class="hidden"><div class="grid"><div class="stat"><div class="num" id="customerCount">0</div><div>CUSTOMERS</div></div><div class="stat"><div class="num" id="bookingCount">0</div><div>BOOKINGS</div></div><div class="stat"><div class="num" id="pendingCount">0</div><div>PENDING</div></div></div><div class="panel"><h2>Bookings</h2><div id="bookings">Loading...</div><button class="btn" id="refresh">REFRESH</button><button class="btn" id="logout">LOG OUT</button><div id="dashStatus" class="status"></div></div></div><div style="text-align:center;font-size:11px;color:#aaa;margin-top:25px"><a href="booking.html" style="color:#f08fbd">Customer booking page</a> · Western Cape only</div></div><script>const SUPABASE_URL='https://ajvoekfnkojlfhmhoxeu.supabase.co';const SUPABASE_KEY='sb_publishable_IOXWfPO3odpweLvODuWm0A_ntPYO6Xq';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);function status(t){$('dashStatus').textContent=t}async function setStatus(id,value){status('Updating booking…');const {error}=await db.from('bookings').update({status:value}).eq('id',id);if(error){status('Could not update: '+error.message);return}status('Booking marked '+value+'.');load()}async function load(){const {data:{session}}=await db.auth.getSession();if(!session){$('login').classList.remove('hidden');$('dash').classList.add('hidden');return}const {data:profile,error:pe}=await db.from('profiles').select('role').eq('id',session.user.id).single();if(pe||profile?.role!=='owner'){ $('login').classList.remove('hidden');$('dash').classList.add('hidden');$('loginStatus').textContent='This account is not marked as the NIX Nails owner. Run the owner setup step in Supabase first.';return}$('login').classList.add('hidden');$('dash').classList.remove('hidden');status('Loading bookings...');const {data:profiles,error:ce}=await db.from('profiles').select('id,full_name,instagram,created_at').order('created_at',{ascending:false});if(ce){status(ce.message);return}const {data:bookings,error:be}=await db.from('bookings').select('*').order('created_at',{ascending:false});if(be){status(be.message);return}$('customerCount').textContent=profiles?.filter(p=>p.role!=='owner').length??0;$('bookingCount').textContent=bookings?.length??0;$('pendingCount').textContent=bookings?.filter(b=>b.status==='pending').length??0;const html=(bookings||[]).map(b=>`<div class="booking"><h2>${escapeHtml(b.full_name)}</h2><div class="meta">${escapeHtml(b.email)} · ${escapeHtml(b.instagram||'No Instagram')}<br>${escapeHtml(b.set_type)} · ${escapeHtml(b.shape||'')} · ${escapeHtml(b.length||'')}<br>Preferred date: ${escapeHtml(b.preferred_date||'Not specified')} · Submitted: ${new Date(b.created_at).toLocaleString()}</div><span class="pill">${escapeHtml((b.status||'pending').toUpperCase())}</span><div class="statusRow"><select id="status-${b.id}"><option value="pending" ${(b.status||'pending')==='pending'?'selected':''}>Pending</option><option value="confirmed" ${b.status==='confirmed'?'selected':''}>Confirmed</option><option value="completed" ${b.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${b.status==='cancelled'?'selected':''}>Cancelled</option></select><button class="btn smallBtn" onclick="setStatus('${b.id}',document.getElementById('status-${b.id}').value)">UPDATE STATUS</button></div><p>${escapeHtml(b.design_notes||'')}</p><p class="meta">Sizing notes: ${escapeHtml(b.sizing_notes||'')}<br>Extra: ${escapeHtml(b.extra_notes||'')}</p><div class="photos" id="photos-${b.id}">Loading photos...</div></div>`).join('');$('bookings').innerHTML=html||'<p class="meta">No bookings yet.</p>';for(const b of bookings||[]){const {data:photos}=await db.from('booking_photos').select('*').eq('booking_id',b.id);let links='';for(const p of photos||[]){const {data:s}=await db.storage.from('booking-photos').createSignedUrl(p.storage_path,3600);if(s?.signedUrl)links+=`<a href="${s.signedUrl}" target="_blank">Open ${escapeHtml(p.photo_type)} photo</a>`}document.getElementById('photos-'+b.id).innerHTML=links||'<span class="meta">No photos attached.</span>'}status('Ready.')}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('loginBtn').onclick=async()=>{ $('loginStatus').textContent='Logging in...';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('loginStatus').textContent=error.message;else load()};$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};load();</script></body></html>
